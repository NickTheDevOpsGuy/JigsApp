# .github/workflows/Phuzzle.yml
name: 🧩 Phuzzle

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: Phuzzle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: 🧩 Phuzzle
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read
      pull-requests: read
      statuses: write # for Lighthouse CI status checks (if enabled later)

    defaults:
      run:
        working-directory: .

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Quality guards (no test.skip / no console.log in src)
        run: npm run guard:quality

      - name: 🧹 ESLint
        run: npm run lint

      - name: 🧪 TypeScript typecheck
        run: npm run typecheck

      - name: 🎨 Prettier check
        run: npm run format:check

      - name: 🏗️ Build
        run: npm run build

      - name: 📦 Bundle size check
        run: npm run check:bundle

      - name: 🧪 Unit tests (Vitest)
        run: npm run test

      - name: 📦 Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit chrome msedge

      - name: 🎭 E2E tests (Playwright)
        env:
          PW_USE_CHROME: "1"
          PW_USE_EDGE: "1"
        run: npm run test:e2e:smoke

      - name: 📱 Responsive layout matrix
        env:
          PW_USE_CHROME: "1"
          PW_USE_EDGE: "1"
        run: npm run test:e2e:layouts

      - name: 🔦 Lighthouse CI (perf, a11y)
        env:
          LHCI_UPLOAD__GITHUB_TOKEN: ${{ github.token }}
        run: npx lhci autorun
