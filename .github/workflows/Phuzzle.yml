# .github/workflows/Phuzzle.yml
name: 🧩 Phuzzle

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: Phuzzle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🧩 Quality + Build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read
      pull-requests: read
      statuses: write # for Lighthouse CI status checks (if enabled later)

    defaults:
      run:
        working-directory: .

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Quality guards (no test.skip / no console.log in src)
        run: npm run guard:quality

      - name: 🧹 ESLint
        run: npm run lint

      - name: 🧪 TypeScript typecheck
        run: npm run typecheck

      - name: 🎨 Prettier check
        run: npm run format:check

      - name: 🏗️ Build
        run: npm run build

      - name: 📦 Bundle size check
        env:
          BASELINE_REF: origin/${{ github.base_ref }}
          CHECK_BUNDLE_USE_EXISTING_DIST: "1"
        run: npm run check:bundle

      - name: 🧪 Unit tests (Vitest)
        run: npm run test

      - name: 📤 Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: phuzzle-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  e2e-smoke:
    name: 🎭 E2E smoke
    runs-on: ubuntu-latest
    needs: quality
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PW_USE_EXISTING_BUILD: "1"
      PW_USE_EDGE: "1"

    defaults:
      run:
        working-directory: .

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📥 Download production build
        uses: actions/download-artifact@v4
        with:
          name: phuzzle-dist
          path: dist

      - name: 📦 Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit msedge

      - name: 🎭 E2E smoke tests
        run: npm run test:e2e:smoke

      - name: 📤 Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  e2e-layouts:
    name: 📐 Responsive layouts
    runs-on: ubuntu-latest
    needs: quality
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PW_USE_EXISTING_BUILD: "1"

    defaults:
      run:
        working-directory: .

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📥 Download production build
        uses: actions/download-artifact@v4
        with:
          name: phuzzle-dist
          path: dist

      - name: 📦 Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: 📐 Responsive layout tests
        run: npm run test:e2e:layouts

      - name: 📤 Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-layout-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: 🔦 Lighthouse
    runs-on: ubuntu-latest
    needs: quality
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read
      pull-requests: read
      statuses: write

    defaults:
      run:
        working-directory: .

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📥 Download production build
        uses: actions/download-artifact@v4
        with:
          name: phuzzle-dist
          path: dist

      - name: 🔦 Lighthouse CI (perf, a11y)
        env:
          LHCI_UPLOAD__GITHUB_TOKEN: ${{ github.token }}
        run: npx lhci autorun

      - name: 📤 Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-reports
          path: lhci-reports
          if-no-files-found: ignore
          retention-days: 7
