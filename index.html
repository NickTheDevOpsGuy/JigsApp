<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var stored = localStorage.getItem("phuzzle-theme");
        var themes = ["light", "dark", "space", "ocean", "forest", "sunset"];
        var theme;
        if (stored && themes.indexOf(stored) !== -1) {
          theme = stored;
        } else {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.className = "theme-" + theme;
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="Phuzzle – Jigsaw puzzles, reimagined" />
    <meta
      property="og:description"
      content="Solve beautiful jigsaw puzzles in your browser. Relax, race the clock, or play with a friend."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://phuzzle.vercel.app/" />
    <meta property="og:image" content="https://phuzzle.vercel.app/icon-512.png" />
    <meta property="og:site_name" content="Phuzzle" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Phuzzle – Jigsaw puzzles, reimagined" />
    <meta
      name="twitter:description"
      content="Solve beautiful jigsaw puzzles in your browser. Relax, race the clock, or play with a friend."
    />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Phuzzle" />
    <title>Phuzzle</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Reload when a chunk or stylesheet fails to load (stale cache, flaky network)
      (function () {
        function isChunkLoadError(msg) {
          return (
            msg &&
            (msg.includes("Failed to fetch dynamically imported module") ||
              msg.includes("Importing a module script failed") ||
              msg.includes("Loading chunk") ||
              msg.includes("ChunkLoadError"))
          );
        }
        function scheduleReload() {
          if (!window._phuzzleReloadScheduled) {
            window._phuzzleReloadScheduled = true;
            window.location.reload();
          }
        }
        window.addEventListener("error", function (e) {
          if (e.target && e.target.tagName === "LINK" && e.target.rel === "stylesheet") {
            scheduleReload();
            return;
          }
          if (isChunkLoadError(e.message)) {
            e.preventDefault();
            scheduleReload();
          }
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          var msg = (e.reason && e.reason.message) || String(e.reason || "");
          if (isChunkLoadError(msg)) {
            e.preventDefault();
            scheduleReload();
          }
        });
        // Attach onerror to stylesheet links (catches load failures on older browsers)
        document.addEventListener("DOMContentLoaded", function () {
          document.querySelectorAll('link[rel="stylesheet"]').forEach(function (link) {
            link.addEventListener("error", scheduleReload);
          });
        });
      })();
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
